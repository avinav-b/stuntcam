# SPDX-License-Identifier: Apache-2.0
# release: builds the npm package on a GitHub-hosted macOS runner with scripts/package.sh and stages it on npm with
# `npm stage publish` (trusted publishing over OIDC: no npm token exists anywhere). A staged version is not installable:
# a maintainer reviews it on npmjs.com (Staged Packages) or with `npm stage approve <id>`, which needs their 2FA, and
# only then is it released, with the tag it was staged with.
#
# Triggers: pushing a tag v<VERSION> (build + stage), or running it by hand (workflow_dispatch): a dry run that builds,
# checks and uploads the package as a workflow artifact, and stages it only if `stage` is ticked on a v* tag.
# The package must be built with the Xcode the frozen stub's hash and the shipped restore rules were measured with
# (PACKAGER_XCODE_BUILD); the `xcode-27` image has it installed side by side. Actions are pinned by commit.
#
# The camera helper (Stuntcam Camera.app, the `webcam` source) is the one Developer ID-signed, notarized binary:
#   preflight (tags: the repo variable HELPER_TEAM_ID is set) -> helper (unsigned release build from the checkout, no
#   secrets; build-machine path scan) -> sign-helper (tags only; environment `helper-signing`, which holds the secrets;
#   checks out nothing, runs no repo code; temporary keychain, codesign, notarytool, staple) -> build (package.sh
#   --helper: the signed bundle goes inside payload.tar, manifest line 2 says `helper release`) -> verify -> stage.
# Bundles travel between jobs as ustar tars: upload-artifact drops exec bits. A run from a non-tag ref can't reach the
# environment: it packages a dev helper (ad-hoc, `helper dev`), and stage refuses any package without `helper release`.
# A tag fails in preflight without the repository variable HELPER_TEAM_ID, and in sign-helper's first step without the
# environment secrets HELPER_DEVID_P12_BASE64, HELPER_DEVID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64.
# This runs on the public repo, where environment rules are free. Create `helper-signing` there BEFORE the first tag
# (an `environment:` that names a missing one creates it with no rules): Selected tags `v*`, admin bypass off.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: Also stage the package on npm (only from a v* tag)
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  NPM_VERSION: 11.19.0   # the same npm packs in both jobs, so the staged tarball is byte-identical to the built one
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Release signing configured
        env:
          TEAM: ${{ vars.HELPER_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF_TYPE != tag ]]; then
            echo "not a tag ($GITHUB_REF): a dry run. The package gets an unsigned dev camera helper (manifest: helper dev) and is never staged."
            exit 0
          fi
          if [[ ! $TEAM =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME: the repository variable HELPER_TEAM_ID (the Developer ID team id that signs the camera helper) is not set"
            exit 1
          fi
          echo "the camera helper will be signed by team $TEAM in the helper-signing environment"

  helper:
    # the unsigned release bundle, built from the checkout without secrets; scanned for build-machine paths by build.sh
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: zsh -euo pipefail {0}
    env:
      PACKAGER_XCODE_BUILD: 27A266a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode ${{ env.PACKAGER_XCODE_BUILD }}
        run: |
          found=
          for x in /Applications/Xcode*.app(N); do
            b=$(DEVELOPER_DIR=$x/Contents/Developer xcodebuild -version 2>/dev/null | sed -n 's/^Build version //p') || b=
            if [[ $b == $PACKAGER_XCODE_BUILD ]]; then found=$x; break; fi
          done
          [[ -n $found ]] || { echo "::error::no Xcode with build $PACKAGER_XCODE_BUILD on this runner"; exit 1; }
          echo "DEVELOPER_DIR=$found/Contents/Developer" >> $GITHUB_ENV
          echo "SIMCAM_HOME=$RUNNER_TEMP/simcam-home" >> $GITHUB_ENV
      - name: Build the unsigned helper (helper/build.sh --release)
        run: |
          helper/build.sh --release
          cd build/helper
          COPYFILE_DISABLE=1 tar --format ustar --no-xattrs --no-mac-metadata --no-acls --uid 0 --gid 0 \
            -cf helper-unsigned.tar "Stuntcam Camera.app" entitlements.plist
          tar -tvf helper-unsigned.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-unsigned
          path: build/helper/helper-unsigned.tar
          if-no-files-found: error
          retention-days: 7

  sign-helper:
    # tags only (the environment's deployment rule allows v* tags only; a required reviewer is optional). No checkout and
    # no repository code: the artifact is unpacked, checked and signed with system tools.
    needs: helper
    if: github.ref_type == 'tag'
    runs-on: xcode-27
    timeout-minutes: 150   # a team's first notarizations can take over an hour
    environment: helper-signing
    permissions: {}
    defaults:
      run:
        shell: zsh -euo pipefail {0}
    env:
      TEAM: ${{ vars.HELPER_TEAM_ID }}
      BUNDLE_ID: dev.stuntcam.camera
    steps:
      - name: Signing secrets present
        env:
          S_P12: ${{ secrets.HELPER_DEVID_P12_BASE64 }}
          S_P12_PASS: ${{ secrets.HELPER_DEVID_P12_PASSWORD }}
          S_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          S_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          S_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          for pair in S_P12:HELPER_DEVID_P12_BASE64 S_P12_PASS:HELPER_DEVID_P12_PASSWORD S_KEY_ID:ASC_KEY_ID \
                      S_ISSUER:ASC_ISSUER_ID S_P8:ASC_KEY_P8_BASE64; do
            [[ -n ${(P)${pair%%:*}} ]] || missing+=(${pair#*:})
          done
          if (( ${#missing} )); then
            echo "::error::the helper-signing environment lacks the secret(s) ${missing[*]}: a Developer ID Application .p12 (base64) and its password, and an App Store Connect API key's id, issuer id and .p8 (base64)"
            exit 1
          fi
          [[ $TEAM =~ '^[A-Z0-9]{10}$' ]] || { echo "::error::HELPER_TEAM_ID is not a team id"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helper-unsigned
          path: ${{ runner.temp }}/in
      - name: Unpack and check the bundle
        run: |
          W=$RUNNER_TEMP/w; mkdir -p $W && tar -xf $RUNNER_TEMP/in/helper-unsigned.tar -C $W
          APP="$W/Stuntcam Camera.app"
          [[ -x "$APP/Contents/MacOS/stuntcam-camera" ]] || { echo "::error::no executable in the bundle"; exit 1; }
          if find $W -type l | grep -q .; then echo "::error::the bundle contains a symlink"; exit 1; fi
          [[ $(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist") == $BUNDLE_ID ]] || { echo "::error::bundle id isn't $BUNDLE_ID"; exit 1; }
          ENT=$(plutil -convert json -o - $W/entitlements.plist)
          [[ $ENT == '{"com.apple.security.device.camera":true}' ]] || { echo "::error::entitlements aren't exactly com.apple.security.device.camera: $ENT"; exit 1; }
          echo "W=$W" >> $GITHUB_ENV
      - name: Temporary keychain with the Developer ID certificate
        env:
          S_P12: ${{ secrets.HELPER_DEVID_P12_BASE64 }}
          S_P12_PASS: ${{ secrets.HELPER_DEVID_P12_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/helper-signing.keychain-db; KPW=$(openssl rand -hex 32)
          echo "KC=$KC" >> $GITHUB_ENV
          security create-keychain -p "$KPW" $KC
          security set-keychain-settings -lut 3600 $KC
          security unlock-keychain -p "$KPW" $KC
          (umask 077; print -rn -- "$S_P12" | base64 -D > $RUNNER_TEMP/devid.p12)
          security import $RUNNER_TEMP/devid.p12 -k $KC -P "$S_P12_PASS" -T /usr/bin/codesign
          rm -f $RUNNER_TEMP/devid.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" $KC > /dev/null
          security list-keychains -d user -s $KC ${(f)"$(security list-keychains -d user | tr -d '" ')"}
          # no match fails the pipeline (grep), which -e -o pipefail would turn into a silent exit: fall through to the error
          ID=$(security find-identity -v -p codesigning $KC | grep "Developer ID Application: .*($TEAM)" | head -1 | awk '{print $2}') || ID=
          [[ $ID =~ '^[0-9A-F]{40}$' ]] || { echo "::error::no Developer ID Application identity of team $TEAM in the .p12"; exit 1; }
          echo "IDENTITY=$ID" >> $GITHUB_ENV
      - name: Sign
        run: |
          codesign -f -s $IDENTITY --keychain $KC -o runtime --timestamp -i $BUNDLE_ID --entitlements $W/entitlements.plist "$W/Stuntcam Camera.app"
          codesign --verify --strict "$W/Stuntcam Camera.app"
      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          P8=$RUNNER_TEMP/asc.p8
          trap 'rm -f $P8 $RUNNER_TEMP/helper.zip' EXIT  # the key goes when this step ends, however it ends
          (umask 077; print -rn -- "$ASC_KEY_P8_BASE64" | base64 -D > $P8)
          # notarytool takes a zip, not a bundle; the ticket is stapled to the bundle itself and the zip thrown away
          ditto -c -k --keepParent "$W/Stuntcam Camera.app" $RUNNER_TEMP/helper.zip
          xcrun notarytool submit $RUNNER_TEMP/helper.zip --key $P8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 2h --output-format json > $RUNNER_TEMP/notary.json || true
          cat $RUNNER_TEMP/notary.json
          ST=$(plutil -extract status raw -o - $RUNNER_TEMP/notary.json 2>/dev/null) || ST=
          if [[ $ST != Accepted ]]; then
            SID=$(plutil -extract id raw -o - $RUNNER_TEMP/notary.json 2>/dev/null) || SID=
            [[ -n $SID ]] && xcrun notarytool log "$SID" --key $P8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::notarization status: ${ST:-none}"; exit 1
          fi
          rm -f $P8 $RUNNER_TEMP/helper.zip
          # the ticket can take a while to be fetchable after Accepted
          for i in 1 2 3 4 5; do xcrun stapler staple "$W/Stuntcam Camera.app" && break; (( i < 5 )) || exit 1; sleep 30; done
      - name: Remove the keychain and the key files
        # before anything else runs: key material doesn't outlive signing and notarization
        if: always()
        run: |
          [[ -n ${KC:-} ]] && security delete-keychain $KC || true
          rm -f $RUNNER_TEMP/devid.p12 $RUNNER_TEMP/asc.p8 $RUNNER_TEMP/helper.zip
      - name: Check the signed helper
        run: |
          APP="$W/Stuntcam Camera.app"
          xcrun stapler validate "$APP"
          codesign --verify --strict "$APP"
          spctl --status | grep -q 'assessments enabled' || sudo spctl --global-enable || true  # the check below needs Gatekeeper on
          spctl -a -t exec -vv "$APP" 2>&1 | tee $RUNNER_TEMP/spctl.txt
          grep -q 'source=Notarized Developer ID' $RUNNER_TEMP/spctl.txt || { echo "::error::Gatekeeper doesn't see a notarized Developer ID app"; exit 1; }
          CS=$(codesign -dv "$APP" 2>&1)
          [[ $CS == *"TeamIdentifier=$TEAM"* ]] || { echo "::error::signed by another team"; exit 1; }
          [[ $CS == *"Identifier=$BUNDLE_ID"* ]] || { echo "::error::bundle id"; exit 1; }
          if find "$APP" -type l | grep -q .; then echo "::error::the signed bundle contains a symlink"; exit 1; fi
          cd $W && COPYFILE_DISABLE=1 tar --format ustar --no-xattrs --no-mac-metadata --no-acls --uid 0 --gid 0 \
            -cf $RUNNER_TEMP/helper-signed.tar "Stuntcam Camera.app"
          tar -tvf $RUNNER_TEMP/helper-signed.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-signed
          path: ${{ runner.temp }}/helper-signed.tar
          if-no-files-found: error
          retention-days: 30

  build:
    # tags: the signed helper from sign-helper; other refs: sign-helper is skipped and package.sh builds a dev helper
    needs: [helper, sign-helper]
    if: >-
      ${{ !cancelled() && needs.helper.result == 'success' &&
      (needs.sign-helper.result == 'success' || (github.ref_type != 'tag' && needs.sign-helper.result == 'skipped')) }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: zsh -euo pipefail {0}
    env:
      PACKAGER_XCODE_BUILD: 27A266a
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          V=$(<VERSION)
          # the same pattern as scripts/package.sh
          [[ $V =~ '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' ]] || { echo "::error::VERSION isn't semver: $V"; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != v$V ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match VERSION $V"; exit 1
          fi
          # a prerelease never becomes `latest`
          [[ $V == *-* ]] && T=next || T=latest
          echo "version=$V" >> $GITHUB_OUTPUT; echo "tag=$T" >> $GITHUB_OUTPUT
          echo "version $V, npm tag $T, ref $GITHUB_REF"
      - name: Select Xcode ${{ env.PACKAGER_XCODE_BUILD }}
        run: |
          found=
          for x in /Applications/Xcode*.app(N); do
            b=$(DEVELOPER_DIR=$x/Contents/Developer xcodebuild -version 2>/dev/null | sed -n 's/^Build version //p') || b=
            echo "$x: ${b:-?}"
            if [[ $b == $PACKAGER_XCODE_BUILD ]]; then found=$x; break; fi
          done
          [[ -n $found ]] || { echo "::error::no Xcode with build $PACKAGER_XCODE_BUILD on this runner"; exit 1; }
          sudo xcode-select -s $found/Contents/Developer
          echo "DEVELOPER_DIR=$found/Contents/Developer" >> $GITHUB_ENV
          DEVELOPER_DIR=$found/Contents/Developer xcodebuild -version; sw_vers
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm ${{ env.NPM_VERSION }}
        run: |
          npm install -g npm@$NPM_VERSION && npm --version && go version
          echo "SIMCAM_HOME=$RUNNER_TEMP/simcam-home" >> $GITHUB_ENV
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref_type == 'tag'
        with:
          name: helper-signed
          path: ${{ runner.temp }}/helper-in
      - name: Build the package (scripts/package.sh)
        env:
          HELPER_TEAM_ID: ${{ vars.HELPER_TEAM_ID }}
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            mkdir -p $RUNNER_TEMP/helper && tar -xf $RUNNER_TEMP/helper-in/helper-signed.tar -C $RUNNER_TEMP/helper
            scripts/package.sh --helper "$RUNNER_TEMP/helper/Stuntcam Camera.app"
          else
            scripts/package.sh   # a dry run: an ad-hoc dev helper, `helper dev` in the manifest
          fi
      - name: Check the package
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          P=build/package
          ls -l $P
          [[ -f $P/stuntcam-$V.tgz ]] || { echo "::error::no $P/stuntcam-$V.tgz"; exit 1; }
          M=$P/stuntcam/share/stuntcam/manifest.txt
          sed -n 1,2p $M
          [[ $(sed -n 1p $M) == "stuntcam $V commit "* ]] || { echo "::error::manifest line 1 isn't stuntcam $V"; exit 1; }
          [[ $(sed -n 2p $M) == *" xcode $PACKAGER_XCODE_BUILD" ]] || { echo "::error::not packaged with Xcode $PACKAGER_XCODE_BUILD"; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            [[ $(sed -n 2p $M) == *" helper release "* ]] || { echo "::error::a tag build without the signed release helper"; exit 1; }
          fi
          [[ -x $P/stuntcam/bin/stuntcam ]] || { echo "::error::bin/stuntcam isn't executable"; exit 1; }
          $P/stuntcam/bin/stuntcam version
          (cd $P && shasum -a 256 stuntcam-$V.tgz | tee stuntcam-$V.tgz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            build/package/stuntcam-*.tgz
            build/package/stuntcam-*.tgz.sha256
            build/package/filelist.txt
            build/package/stuntcam/share/stuntcam/manifest.txt
          if-no-files-found: error
          retention-days: 30

  verify:
    # every run, dry runs included: the Linux repack that `stage` publishes must equal the built tarball
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@$NPM_VERSION && npm --version
      - name: Repack equals the built tarball
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum -c "stuntcam-$V.tgz.sha256"
          mkdir pkg out && tar -xzf "stuntcam-$V.tgz" -C pkg
          test -x pkg/package/bin/stuntcam
          (cd pkg/package && npm pack --ignore-scripts --pack-destination ../../out)
          echo "$(cut -d' ' -f1 "stuntcam-$V.tgz.sha256")  out/stuntcam-$V.tgz" | sha256sum -c

  stage:
    needs: [build, verify]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.verify.result == 'success' &&
      github.ref_type == 'tag' && (github.event_name == 'push' || inputs.stage) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      id-token: write   # OIDC for npm trusted publishing (and provenance)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@$NPM_VERSION && npm --version
      - name: Stage on npm
        env:
          V: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          sha256sum -c "stuntcam-$V.tgz.sha256"
          mkdir pkg && tar -xzf "stuntcam-$V.tgz" -C pkg
          cd pkg/package
          test -x bin/stuntcam
          # only a package with the signed, notarized camera helper is ever staged (a dry run's says `helper dev`)
          if [[ $(sed -n 2p share/stuntcam/manifest.txt) != *" helper release "* ]]; then
            echo "::error::share/stuntcam/manifest.txt line 2 doesn't say 'helper release': not staging a package with a dev camera helper"
            exit 1
          fi
          # `npm stage publish` packs the current folder: it must pack byte-for-byte what package.sh packed
          npm pack --ignore-scripts --pack-destination ..
          (cd .. && echo "$(cut -d' ' -f1 "../stuntcam-$V.tgz.sha256")  stuntcam-$V.tgz" | sha256sum -c)
          npm stage publish --ignore-scripts --tag "$TAG" --access public
          echo "Staged stuntcam@$V (tag $TAG). Approve it on npmjs.com (Staged Packages) or with: npm stage approve <id>"
